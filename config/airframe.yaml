    mass_kg: 0.010
    confidence: vendor
    source: "Pi Camera Module 3 board ~4 g + 15-22 pin FFC cable.
             THE mapping / detection / navigation sensor. CSI to the Pi 5."
    pos: [0.090, 0.000, -0.025]
    power_w: 0.5

  - id: wifi
    name: "ALFA AWUS036ACM AC1200 USB 3.0 + 2x 5dBi antennas"
    qty: 1
    mass_kg: 0.145
    confidence: estimated
    source: "adapter ~105 g + 2x 5dBi antennas ~20 g each; CONFIRM on a scale"
