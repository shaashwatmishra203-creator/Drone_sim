    name: "HobbyWing XRotor 3115 900KV"
    qty: 4
    mass_kg: 0.195
    confidence: estimated
    source: "typical 31xx-class outrunner; CONFIRM from vendor datasheet"
    pos: [0.175, 0.175, 0.020]     # magnitude; mirrored to 4 arms by the tool
    mirror: arms

  - id: prop
    name: "propeller (see prop_options)"
    qty: 4
    mass_kg: 0.010
    confidence: estimated
    source: "HQProp 9x4.5 nylon composite, typical"
    pos: [0.175, 0.175, 0.045]
    mirror: arms

  - id: battery
    name: "Ovonic 22.2V 6S 50C 6000mAh (XT90 female)"
    qty: 1
    mass_kg: 0.830
    confidence: estimated
    source: "typical 6S 6000mAh LiPo; WEIGH THIS — largest single mass"
    pos: [0.000, 0.000, 0.055]

  - id: fc_stack
