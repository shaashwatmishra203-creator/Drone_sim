# ============================================================================
# Drone Team — Airframe Configuration
# Single source of truth for the sizing model, the Gazebo SDF, the PX4 airframe,
# and the generated documentation. Change numbers HERE, never in generated files.
#
# confidence:  measured    — someone put it on a scale
#              vendor      — manufacturer published spec
#              estimated   — engineering estimate, NEEDS VERIFICATION
#
# Frame convention: FLU body frame (x fwd, y left, z up), origin at the
# geometric centre of the main frame plate. Positions in metres.
# ============================================================================

meta:
  name: n360_quad
  description: "Quadrotor, 500 mm class, 6S, autonomy/perception payload"
  revision: 0
  date: 2026-09-30
  # Every mass below marked 'estimated' is a placeholder until the team weighs it.
  masses_are_provisional: true

environment:
  # Density altitude is a real endurance factor — do not silently assume ISA SL.
  altitude_m: 0.0
  temperature_c: 15.0
  pressure_pa: 101325.0
  gravity: 9.80665

geometry:
  layout: quad_x
  arm_length_m: 0.2475        # motor axis to CG, => 495 mm diagonal wheelbase
  motor_cant_deg: 0.0
  body:                       # main body box, used for the inertia estimate
    x_m: 0.200
    y_m: 0.160
    z_m: 0.110
  # Rotor order follows PX4 quad_x: 1=FR(ccw) 2=RL(ccw) 3=FL(cw) 4=RR(cw)

# ---------------------------------------------------------------------------
# MASS REGISTER
# ---------------------------------------------------------------------------
