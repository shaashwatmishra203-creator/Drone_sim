name: factory_mission
description: >
  The representative mission: launch from base, fly a slalom obstacle course
  through a factory-like environment, scan a room at the far end (the mapping
  pass whose data would be shared with the other vehicles), then return to
  base and land. Flown at low speed, as a survey would be.

  Everything here is measured: leg-by-leg flight time, energy per leg, and how
  much battery reserve is left on touchdown.
world: factory
# Light wind — an indoor factory is not still, but it is not open sky either.
wind: {mean_ms: [1.5, 0.5, 0.0], gust_ms: 0.8}
until_empty: false
max_duration_s: 600

# Survey flight must be deliberate. Left at PX4's defaults the position
# controller accelerates to ~12 m/s between waypoints; one run peaked at
# 11.5 m/s, clipped gate 0 and tumbled ("Imbalanced propeller detected" in the
# PX4 log is its collision signature). A 2.5 m gate against a 0.5 m airframe
# needs a speed the controller can actually stop from.
px4_params:
  MPC_XY_VEL_MAX: 2.5      # m/s horizontal ceiling
  MPC_XY_CRUISE: 2.0       # m/s target between waypoints
  MPC_ACC_HOR: 1.5         # m/s2 horizontal acceleration
  MPC_ACC_HOR_MAX: 2.0
  MPC_JERK_AUTO: 4.0
  MPC_Z_VEL_MAX_UP: 1.5
  MPC_Z_VEL_MAX_DN: 1.0
  MPC_TKO_SPEED: 1.0

profile:
  type: factory_mission
  altitude_m: 2.5
  # Tight acceptance radius: with a loose one the controller cuts corners and
  # the real path diverges from the planned one - an earlier version clipped
  # three obstacles that way.
  accept_radius_m: 0.7
  base: [0.0, 0.0]

  # Outbound: through four gates, each a full-height barrier across a walled
  # corridor with a single 2.5 m gap, alternating side to side. Each gate gets
  # a line-up point before it so the aircraft arrives square rather than
  # diagonally.
  outbound:
    - [ 5.0,  0.0, 2.5]     # corridor entry
    - [ 7.0,  2.4, 2.5]     # line up with gate 0
    - [ 9.0,  2.4, 2.5]     # through gate 0
    - [11.0, -2.4, 2.5]     # line up with gate 1
    - [13.0, -2.4, 2.5]     # through gate 1
    - [15.0,  2.4, 2.5]     # line up with gate 2
    - [17.0,  2.4, 2.5]     # through gate 2
    - [19.0, -2.4, 2.5]     # line up with gate 3
    - [21.0, -2.4, 2.5]     # through gate 3
    - [26.0,  0.0, 2.5]     # line up with the doorway
    - [30.0,  0.0, 2.5]     # enter the room

  # Scan: lawnmower sweep inside the 12 x 12 m room with a continuous yaw
  # sweep, so the cameras cover walls, floor and the objects inside.
  # Scan altitude is 3.0 m, not 2.2 m. The tallest object in the room (the
  # machine) is 2.2 m, so a 2.2 m sweep grazed its top - measured at 0.08 m,
  # i.e. inside the airframe hull. A survey pass flies above the clutter it is
  # mapping; 3.0 m leaves 0.8 m over the tallest object and still sits a metre
  # below the 4 m ceiling.
  scan:
    altitude_m: 3.0
    accept_radius_m: 1.0
    yaw_rate_rad_s: 0.35
    pattern:
      - [29.0, -4.0, 3.0]
      - [35.0, -4.0, 3.0]
      - [35.0, -1.3, 3.0]
      - [29.0, -1.3, 3.0]
      - [29.0,  1.3, 3.0]
      - [35.0,  1.3, 3.0]
      - [35.0,  4.0, 3.0]
      - [29.0,  4.0, 3.0]

  # Inbound: back out of the room and retrace the course to base.
  inbound:
    - [30.0,  0.0, 2.5]
    - [26.0,  0.0, 2.5]
    - [21.0, -2.4, 2.5]     # line up with gate 3 from the far side
    - [19.0, -2.4, 2.5]     # back through gate 3
    - [17.0,  2.4, 2.5]     # line up with gate 2
    - [15.0,  2.4, 2.5]     # back through gate 2
    - [13.0, -2.4, 2.5]     # line up with gate 1
    - [11.0, -2.4, 2.5]     # back through gate 1
    - [ 9.0,  2.4, 2.5]     # line up with gate 0
    - [ 7.0,  2.4, 2.5]     # back through gate 0
    - [ 5.0,  0.0, 2.5]     # corridor exit
    - [ 0.0,  0.0, 2.5]     # over the base pad
